name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # permite rodar manualmente pelo celular (botão "Run workflow")

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O Android SDK já vem instalado no runner ubuntu-latest.
      # NÃO use "setup-android" (foi a causa de falha do build anterior).
      - name: Instalar Gradle 8.7 (sem precisar do gradle-wrapper.jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testes unitários
        run: gradle :app:testDebugUnitTest --stacktrace

      -
