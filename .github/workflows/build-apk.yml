name: Build TITAN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Conferir arquivos enviados
        run: |
          echo "--- raiz ---"; ls -la
          echo "--- app ---"; ls -la app || echo "PASTA app NAO ENCONTRADA"
          test -f settings.gradle.kts || echo "settings.gradle.kts NAO ENCONTRADO NA RAIZ"
          test -f app/build.gradle.kts || echo "app/build.gradle.kts NAO ENCONTRADO"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testes unitarios (nao bloqueiam o APK)
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Gerar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TITAN-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
